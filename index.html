<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8C69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Special delivery">
<title>Special Delivery 🛵</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;inset:0;
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:500;color:#3B2340;
  background:linear-gradient(168deg,#FFE0AE 0%,#FFB07C 24%,#FF8A82 48%,#F76E8E 70%,#A96BB0 100%);
  background-attachment:fixed;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 38% at 50% 12%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);
}
#app{position:absolute;inset:0;height:calc(var(--vh,1vh) * 100)}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));
}
.screen.active{display:flex;animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
.screen.scrolls{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;justify-content:flex-start}
.screen.scrolls > *,.clues > *,.actions > *{flex:0 0 auto}

/* ---------- type ---------- */
h1,h2,h3,p{margin:0}
.kicker{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#7A3B57;opacity:.85}
.big{font-size:clamp(26px,8.2vw,38px);font-weight:700;line-height:1.1;text-align:center;letter-spacing:-.01em}
.sub{font-size:clamp(14px,4.1vw,17px);line-height:1.45;text-align:center;opacity:.8;font-weight:400}
.fine{font-size:11.5px;line-height:1.4;text-align:center;opacity:.62;font-weight:400;max-width:17em}

/* ---------- card / buttons ---------- */
.card{
  background:rgba(255,255,255,.93);border-radius:28px;
  box-shadow:0 18px 40px -18px rgba(90,30,70,.5),0 2px 0 rgba(255,255,255,.7) inset;
  padding:26px 22px;width:100%;max-width:420px;
}
.btn{
  -webkit-appearance:none;appearance:none;border:0;font-family:inherit;font-weight:600;
  color:#fff;background:linear-gradient(180deg,#FF5E7D,#E8365F);
  border-radius:999px;padding:18px 26px;font-size:18px;width:100%;max-width:340px;
  min-height:60px;box-shadow:0 10px 22px -8px rgba(200,30,70,.75),0 -3px 0 rgba(0,0,0,.12) inset;
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
}
.btn:active{transform:scale(.96);box-shadow:0 5px 12px -8px rgba(200,30,70,.8)}
.btn.soft{background:rgba(255,255,255,.85);color:#7A3B57;box-shadow:0 8px 18px -10px rgba(90,30,70,.5)}
.btn.gold{background:linear-gradient(180deg,#FFCE4F,#F5A623);color:#5A3210}
.btn.pulse{animation:pulse 1.7s ease-in-out infinite}

#mute{
  position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:70;
  width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.55);
  font-size:20px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
}
#mute:active{transform:scale(.9)}

/* ---------- intro ---------- */
.intro-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;min-height:0}
.hero{height:min(22vh,160px);width:auto;filter:drop-shadow(0 16px 18px rgba(120,40,70,.32));animation:bob 2.8s ease-in-out infinite}
.vs-tag{
  display:inline-block;background:#3B2340;color:#FFD66B;border-radius:999px;
  padding:6px 16px;font-size:13px;font-weight:600;letter-spacing:.08em;
}

/* ---------- countdown ---------- */
#countdown{justify-content:center;gap:10px}
.cd-words{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:center;max-width:340px}
.cd-word{font-size:clamp(30px,10vw,46px);font-weight:700;color:#fff;opacity:0;text-shadow:0 6px 0 rgba(150,40,80,.35)}
.cd-word.in{animation:popIn .45s cubic-bezier(.3,1.6,.5,1) both}
.cd-word.final{display:block;width:100%;text-align:center;color:#FFE27A;font-size:clamp(28px,9vw,42px);margin-top:6px}

/* ---------- ride ---------- */
#ride{justify-content:flex-start;gap:0;padding-left:0;padding-right:0}
.topbar{width:100%;max-width:460px;display:flex;align-items:center;gap:10px;padding:0 18px 0 18px;padding-right:56px}
.hearts{font-size:15px;letter-spacing:2px;white-space:nowrap;line-height:1}
.hearts i{font-style:normal;transition:opacity .2s ease,transform .2s ease;display:inline-block}
.hearts i.off{opacity:.25;transform:scale(.8)}
.meter{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.45);overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#FFE07A,#FF8FA8);border-radius:99px}
.meter .pin{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:10px;line-height:1}
.metertag{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#7A3B57;text-align:center;width:100%;margin-top:5px;opacity:.85}

.stage{
  position:relative;flex:1;min-height:0;width:100%;overflow:hidden;
  -webkit-mask-image:none;
}
.layer{position:absolute;left:0;right:0;pointer-events:none}
.sky{top:0;bottom:0;background:radial-gradient(70% 46% at 72% 16%,rgba(255,240,190,.75),rgba(255,240,190,0) 62%)}
.sun{position:absolute;right:16%;top:12%;width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle,#FFF3C4,#FFC56B);box-shadow:0 0 46px rgba(255,200,110,.75);pointer-events:none}
.far{bottom:var(--roadH);height:190px;background-repeat:repeat-x;background-position:0 bottom;opacity:.85}
.clouds{top:4%;height:40%;background-repeat:repeat-x;background-size:auto 100%;opacity:.5}
.mid{bottom:var(--roadH);height:96px;background-repeat:repeat-x;background-position:0 bottom;opacity:.95}
.road{
  bottom:0;height:var(--roadH);
  background:linear-gradient(180deg,#7A4F72 0%,#684263 36%,#52304F 100%);
  border-top:5px solid rgba(255,255,255,.3);
  box-shadow:0 7px 0 rgba(255,255,255,.08) inset;
}
.dash{position:absolute;left:0;right:0;top:46%;height:5px;background-repeat:repeat-x;opacity:.55}
.actors{position:absolute;left:0;right:0;bottom:0;top:0}
.obs,.pick{position:absolute;bottom:var(--groundY);will-change:transform;line-height:0}
.rider{position:absolute;left:var(--riderX);bottom:var(--groundY);will-change:transform;line-height:0}
.rider.blink{animation:blink .22s steps(2) infinite}
.rider.down .bike{animation:none}
.rider svg,.obs svg,.pick svg{display:block;transform:scale(var(--scale,1));transform-origin:0 100%}
.pick svg{filter:drop-shadow(0 0 7px rgba(255,120,160,.85))}
.guy{animation:pedal .5s ease-in-out infinite}
.rider.down .guy{animation:none}
.wheel{transform-box:fill-box;transform-origin:50% 50%;animation:spin .5s linear infinite}
.rider.down .wheel{animation:none}

.bubble{
  position:absolute;left:50%;top:10px;transform:translateX(-50%) scale(.8);max-width:78%;
  background:#fff;color:#3B2340;border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.3;
  font-weight:500;text-align:center;box-shadow:0 10px 22px -12px rgba(90,30,70,.7);
  opacity:0;pointer-events:none;z-index:6;
  transition:opacity .18s ease,transform .18s cubic-bezier(.3,1.6,.5,1);
}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.chip{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);
  background:#3B2340;color:#FFD66B;border-radius:14px;padding:10px 18px;
  font-size:clamp(16px,5vw,22px);font-weight:700;white-space:nowrap;
  opacity:0;pointer-events:none;z-index:7;box-shadow:0 12px 26px -12px rgba(0,0,0,.6);
}
.chip.show{animation:chipPop .95s cubic-bezier(.22,1,.36,1) both}
.taphint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(59,35,64,.72);color:#FFE9C7;border-radius:999px;padding:9px 18px;
  font-size:13px;font-weight:600;white-space:nowrap;z-index:6;
  animation:hintPulse 1.6s ease-in-out infinite;
}
.taphint.hide{opacity:0;transition:opacity .4s ease}
.stage.shake{animation:shake .32s ease}

/* arrival overlay */
.overlay{
  position:absolute;inset:0;z-index:40;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  background:radial-gradient(70% 50% at 50% 42%,rgba(255,255,255,.4),rgba(90,30,70,.55));
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.overlay.active{display:flex;animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both}
.overlay .sub{width:100%}
.stamp{font-size:58px;line-height:1;animation:bob 2.2s ease-in-out infinite}
.winname{
  width:100%;overflow-wrap:break-word;
  font-size:clamp(26px,8.4vw,40px);font-weight:700;color:#fff;text-align:center;line-height:1.08;
  text-shadow:0 6px 0 rgba(150,40,80,.35)
}

/* ---------- message + clues ---------- */
#prize{gap:16px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.flipcard{width:100%;max-width:420px;perspective:1200px;cursor:pointer}
.flipinner{position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;min-height:260px;transition:transform .85s cubic-bezier(.3,1.1,.4,1)}
.flipcard.open .flipinner{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{
  background:linear-gradient(160deg,#FFD873,#F7A23D);color:#5A3210;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:260px;text-align:center;
}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;gap:14px}
.prize-line{font-size:clamp(16px,4.6vw,19px);line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.prize-line .em{flex:0 0 auto;font-size:20px}
.prize-line.lead{font-weight:700;font-size:clamp(19px,5.6vw,23px);line-height:1.2}
.seal{font-size:52px;line-height:1;animation:bob 2.6s ease-in-out infinite}
.opentag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.7}

.clues{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;align-items:center}
.envrow{display:flex;gap:10px;width:100%}
.env{
  flex:1;border:0;font-family:inherit;cursor:pointer;
  border-radius:20px;min-height:104px;background:rgba(255,255,255,.9);
  box-shadow:0 12px 26px -16px rgba(90,30,70,.8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#7A3B57;font-weight:600;font-size:12px;transition:transform .14s ease;
  padding:8px 7px;text-align:center;
}
.env .ico{font-size:26px;line-height:1}
.env:active{transform:scale(.95)}
.env.open{background:#fff;animation:envPop .5s cubic-bezier(.3,1.5,.5,1) both}
.env.open .ico{font-size:22px}
.env .txt{display:none;font-size:12.5px;line-height:1.28;font-weight:500;color:#3B2340}
.env.open .txt{display:block}
.env.open .lbl{display:none}
.note{background:rgba(59,35,64,.85);color:#FFE9C7;border-radius:18px;padding:13px 16px;
  font-size:13.5px;line-height:1.4;text-align:center;width:100%;font-weight:400}
.teaser{width:100%;text-align:center;font-size:clamp(15px,4.4vw,18px);font-weight:600;color:#fff;
  background:rgba(255,255,255,.18);border:1px dashed rgba(255,255,255,.6);
  border-radius:18px;padding:14px 16px;line-height:1.35}
.hidden{display:none !important}
.reveal{animation:popIn .5s cubic-bezier(.3,1.4,.5,1) both}
.actions{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:2px}
.sig{font-size:12px;opacity:.65;text-align:center;font-weight:400;padding-bottom:4px}

#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---------- keyframes ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes hintPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pedal{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes chipPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
@keyframes envPop{0%{transform:scale(.9) rotate(-2deg)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes taphintOut{to{opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.08s !important}
  .wheel,.guy{animation:none !important}
}
@media (max-height:620px){
  .hero{height:min(19vh,130px)}
}
</style>
</head>
<body>
<div id="app">

  <button id="mute" aria-label="Sound on or off">🔊</button>

  <!-- 1. INTRO -->
  <section class="screen active" id="intro">
    <div class="intro-wrap">
      <span class="kicker" id="i-kicker"></span>
      <div id="heroSlot"></div>
      <span class="vs-tag" id="i-vs"></span>
      <h1 class="big" id="i-title"></h1>
      <p class="sub" id="i-sub"></p>
    </div>
    <button class="btn pulse" id="startBtn"></button>
    <p class="fine" id="i-fine" style="margin-top:12px"></p>
  </section>

  <!-- 2. COUNTDOWN -->
  <section class="screen" id="countdown">
    <div class="cd-words" id="cdWords"></div>
  </section>

  <!-- 3. THE RIDE -->
  <section class="screen" id="ride">
    <div class="topbar">
      <span class="hearts" id="hearts"></span>
      <div class="meter"><i id="meterFill"></i><span class="pin">🏠</span></div>
    </div>
    <div class="metertag" id="meterTag"></div>

    <div class="stage" id="stage">
      <div class="layer sky"></div>
      <div class="sun"></div>
      <div class="layer clouds" id="clouds"></div>
      <div class="layer far" id="far"></div>
      <div class="layer mid" id="mid"></div>
      <div class="layer road"><div class="dash" id="dash"></div></div>
      <div class="actors" id="actors">
        <div class="rider" id="rider"></div>
      </div>
      <div class="bubble" id="bubble"></div>
      <div class="chip" id="chip"></div>
      <div class="taphint" id="tapHint"></div>
    </div>

    <!-- 4. ARRIVAL -->
    <div class="overlay" id="winOverlay">
      <div class="stamp">💌</div>
      <h2 class="winname" id="w-title"></h2>
      <p class="sub" id="w-sub" style="color:#fff;opacity:.95"></p>
      <button class="btn gold" id="prizeBtn"></button>
    </div>
  </section>

  <!-- 5/6/7. THE MESSAGE -->
  <section class="screen scrolls" id="prize">
    <span class="kicker" id="p-kicker" style="margin-bottom:10px"></span>

    <div class="flipcard" id="flipcard">
      <div class="flipinner" id="flipinner">
        <div class="card face front">
          <div class="seal">✉️</div>
          <h2 class="big" style="font-size:clamp(22px,6.6vw,28px)" id="p-front"></h2>
          <span class="opentag" id="p-opentag"></span>
        </div>
        <div class="card face back" id="prizeBack"></div>
      </div>
    </div>

    <div class="clues hidden" id="cluesBox">
      <h3 class="big" style="font-size:clamp(20px,6vw,25px);color:#fff;text-shadow:0 4px 0 rgba(150,40,80,.3)" id="c-title"></h3>
      <p class="sub" style="color:#fff;opacity:.9;margin-top:-4px" id="c-sub"></p>
      <div class="envrow" id="envRow"></div>
      <div class="note" id="c-note"></div>
      <div class="teaser hidden" id="teaser"></div>
      <div class="actions">
        <a class="btn" id="waBtn" href="#" target="_blank" rel="noopener"></a>
        <button class="btn soft" id="rematchBtn"></button>
      </div>
      <p class="sig" id="p-sig"></p>
    </div>
  </section>

</div>
<canvas id="confetti"></canvas>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG — everything you might want to change lives here.
   ============================================================ */
const CONFIG = {
  herName: "Annaëlle",
  myName: "Gianluca",

  // WhatsApp: leave the number empty so she picks the chat herself.
  // Or put yours in international format, digits only: "34600111222"
  whatsappNumber: "",
  whatsappText: "Message received. See you at 19:00 😏",

  intro: {
    kicker: "Special delivery",
    vs: "{me} 🛵 ➜ {name}",
    title: "{me} is riding over with something for you 🛵✉️",
    sub: "He has one message to deliver. Tap to jump.",
    button: "Start the ride",
    fine: "By tapping you agree to be picked up tomorrow."
  },

  countdown: ["Ready…", "Set…"],
  countdownFinal: "ANDIAMO! 🛵",

  ride: {
    meterTag: "DELIVERY TO {name}",
    tapHint: "Tap anywhere to jump 👆",
    // spoken along the way, at these points of the journey (0–1)
    bubbles: [
      { at:0.06, text:"On my way 🛵" },
      { at:0.26, text:"That red light was more of a suggestion." },
      { at:0.46, text:"Halfway. Still handsome." },
      { at:0.66, text:"This envelope is heavier than it looks." },
      { at:0.86, text:"Almost there…" }
    ],
    hits: ["Ouch.", "Saw that. Ignored it.", "Totally intentional.", "The Vespa started it."],
    tumble: "I'm fine! Everything's fine 😅",
    chips: { tumble:"WIPEOUT 💥", heart:"+1 ❤️", arrive:"DELIVERED!" }
  },

  arrival: {
    title: "Delivered to {name} 💌",
    sub: "He made it. Barely.",
    button: "Open the message 💌"
  },

  prize: {
    kicker: "One message for you",
    front: "Your message",
    openTag: "Tap to open",
    lines: [
      { em:"🏆", text:"You got him here. Your prize: me. Tomorrow.", lead:true },
      { em:"😊", text:"I'm genuinely excited to see you." },
      { em:"🚗", text:"I'll pick you up around 19:00." },
      { em:"🤫", text:"Where are we going? That's classified." }
    ],
    sig: "Delivered by {me}. No Vespas were harmed."
  },

  clues: {
    title: "Unlock a clue",
    sub: "Three envelopes. No spoilers.",
    items: [
      { label:"Clue 1", text:"Your hands will be part of the plan 🙌" },
      { label:"Clue 2", text:"There will be wine 🍷" },
      { label:"Clue 3", text:"Something for you to take home 🌱" }
    ],
    note: "Dress code: cute but comfy. Nothing you'd cry over if it gets a little earth on it.",
    teaser: "Then the night continues with food and music 🎶"
  },

  buttons: { whatsapp:"Confirm the date ✅", rematch:"Ride again? 🔁" },

  // --- music: an original tarantella, synthesised live (no audio file) ---
  music: {
    on: true,          // set false for a silent ride
    volume: 0.085,     // sits under the sound effects
    eighth: 0.125      // smaller = faster. 0.125 is a brisk tarantella
  },

  // --- game feel ---
  game: {
    rideSeconds: 15,     // tuned so a clean ride lands around 18s
    maxSeconds: 26,      // he arrives by now no matter what
    speed0: 196,         // px/sec at the start
    speed1: 268,         // px/sec at the end
    gravity: 2300,
    jumpV: 830,
    hearts: 3,
    gapMin: 1.45,        // seconds between obstacles (never less: always jumpable)
    gapVar: 0.85
  }
};

/* ============================================================
   helpers
   ============================================================ */
const $ = function(s){ return document.querySelector(s); };
const T = function(s){ return String(s).replace(/\{name\}/g, CONFIG.herName).replace(/\{me\}/g, CONFIG.myName); };
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };

/* ============================================================
   sound
   ============================================================ */
const Sound = (function(){
  let ctx=null, muted=false, noise=null;
  try { muted = localStorage.getItem("sd_muted")==="1"; } catch(e){}
  function init(){
    if(ctx) return ctx;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      const len = ctx.sampleRate*1;
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ ctx=null; }
    return ctx;
  }
  function on(){ if(ctx && ctx.state==="suspended") ctx.resume(); return !muted && ctx; }
  function tone(o){
    try{
      if(!on()) return;
      const t0 = ctx.currentTime + (o.delay||0);
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = o.type||"sine";
      osc.frequency.setValueAtTime(o.f, t0);
      if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30,o.to), t0+(o.dur||.2));
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol||0.18, t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+(o.dur||.2));
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+(o.dur||.2)+0.05);
    }catch(e){}
  }
  function hiss(dur,f,vol,delay){
    try{
      if(!on() || !noise) return;
      const t0 = ctx.currentTime + (delay||0);
      const src = ctx.createBufferSource(); src.buffer = noise;
      const bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.1;
      bp.frequency.setValueAtTime(f,t0);
      bp.frequency.exponentialRampToValueAtTime(f*0.35,t0+dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol,t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      src.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(t0); src.stop(t0+dur+0.05);
    }catch(e){}
  }
  return {
    init:init,
    getCtx:function(){ return ctx; },
    get muted(){ return muted; },
    toggle:function(){ muted=!muted; try{ localStorage.setItem("sd_muted",muted?"1":"0"); }catch(e){} return muted; },
    jump:function(){ tone({type:"triangle",f:430,to:760,dur:0.16,vol:0.17}); },
    land:function(){ tone({type:"sine",f:190,to:110,dur:0.1,vol:0.13}); },
    pop:function(){ tone({type:"triangle",f:640,to:980,dur:0.09,vol:0.2}); },
    ding:function(){ tone({type:"sine",f:880,dur:0.25,vol:0.16}); tone({type:"sine",f:1320,dur:0.35,vol:0.1,delay:0.05}); },
    bell:function(){ tone({type:"sine",f:1570,dur:0.5,vol:0.14}); tone({type:"sine",f:2100,dur:0.45,vol:0.08,delay:0.03}); },
    hit:function(){ tone({type:"sine",f:150,to:60,dur:0.3,vol:0.26}); hiss(0.2,700,0.14,0); },
    crash:function(){ tone({type:"sine",f:120,to:45,dur:0.5,vol:0.3}); hiss(0.45,900,0.2,0); },
    skid:function(){ hiss(0.55,1500,0.18,0); },
    cheer:function(){
      hiss(1.4,1700,0.12,0);
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone({type:"triangle",f:f,dur:0.5,vol:0.16,delay:i*0.085}); });
      tone({type:"triangle",f:1318.5,dur:0.7,vol:0.14,delay:0.42});
    }
  };
})();

/* ============================================================
   music — an original Italian-style tarantella in A minor.
   Mandolin melody over accordion stabs, walking bass and tambourine.
   Nothing is downloaded: every note is synthesised on the fly.
   ============================================================ */
const Music = (function(){
  const M = CONFIG.music;
  // 16 bars x 6 quavers. 0 = rest.
  const MEL = [
    69,71,72,76,72,69,  67,69,71,74,71,67,  65,67,69,72,69,65,  64,65,68,71,68,64,
    69,72,76,81,79,77,  79,77,76,74,71,67,  77,76,74,72,69,65,  76,74,72,71,68,64,
    72,74,76,79,76,72,  71,72,74,79,74,71,  69,71,72,76,72,69,  68,69,71,76,71,68,
    72,76,79,84,79,76,  71,74,79,83,79,74,  69,72,76,81,76,72,  71,68,64,64, 0, 0
  ];
  const Am=[60,64], G=[59,62], F=[57,60], E=[56,59], C=[55,60];
  const CH   = [Am,G,F,E, Am,G,F,E, C,G,Am,E, C,G,Am,E];
  const BASS = [45,43,41,40, 45,43,41,40, 48,43,45,40, 48,43,45,40];

  let ctx=null, bus=null, noise=null, timer=0, step=0, nextT=0, running=false;
  function hz(m){ return 440*Math.pow(2,(m-69)/12); }

  function voice(type,f,t,dur,vol,detune){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=f; if(detune) o.detune.value=detune;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.03);
  }
  function tamb(t,vol){
    if(!noise) return;
    const src=ctx.createBufferSource(); src.buffer=noise;
    const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=5200;
    const g=ctx.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    src.connect(hp); hp.connect(g); g.connect(bus);
    src.start(t); src.stop(t+0.1);
  }

  function schedule(){
    if(!running || !ctx) return;
    const E8 = M.eighth;
    while(nextT < ctx.currentTime + 0.3){
      const i = step % 96, bar = Math.floor(i/6), e = i % 6;
      const m = MEL[i];
      if(m) voice("triangle", hz(m), nextT, E8*1.7, 0.30, 6);   // mandolin
      if(e===0 || e===3){                                        // bass
        voice("triangle", hz(BASS[bar] + (e===3?7:0)), nextT, 0.24, 0.34);
      }else{                                                     // accordion stabs
        CH[bar].forEach(function(n){ voice("sawtooth", hz(n), nextT, 0.13, 0.08); });
      }
      if(e===2 || e===5) tamb(nextT, 0.05);
      nextT += E8; step++;
    }
  }

  return {
    start:function(){
      if(!M.on) return;
      ctx = Sound.init(); if(!ctx) return;
      if(ctx.state==="suspended") ctx.resume();
      if(!bus){
        bus = ctx.createGain();
        const lp = ctx.createBiquadFilter();
        lp.type="lowpass"; lp.frequency.value=4200;
        bus.connect(lp); lp.connect(ctx.destination);
        const len=ctx.sampleRate*0.3;
        noise=ctx.createBuffer(1,len,ctx.sampleRate);
        const d=noise.getChannelData(0);
        for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      }
      bus.gain.cancelScheduledValues(ctx.currentTime);
      bus.gain.setValueAtTime(Sound.muted?0:M.volume, ctx.currentTime);
      if(running) return;
      running=true; step=0; nextT=ctx.currentTime+0.08;
      schedule();
      timer=setInterval(schedule,60);
    },
    stop:function(fade){
      if(!running) return;
      running=false; clearInterval(timer); timer=0;
      if(bus && ctx){
        const t=ctx.currentTime;
        bus.gain.cancelScheduledValues(t);
        bus.gain.setValueAtTime(Math.max(0.0001,bus.gain.value),t);
        bus.gain.exponentialRampToValueAtTime(0.0001,t+(fade||0.7));
      }
    },
    setMuted:function(mut){
      if(!bus || !ctx) return;
      bus.gain.cancelScheduledValues(ctx.currentTime);
      bus.gain.setValueAtTime(mut?0:M.volume, ctx.currentTime);
    }
  };
})();

$("#prizeBtn").textContent = T(CONFIG.arrival.button);
$("#p-kicker").textContent = T(CONFIG.prize.kicker);
$("#p-front").textContent  = T(CONFIG.prize.front);

/* ============================================================
   confetti
   ============================================================ */
const Confetti = (function(){
  const cv = $("#confetti"), cx = cv.getContext("2d");
  let parts=[], raf=0, last=0;
  const COLORS = ["#FFD66B","#FF6F91","#9B6BD6","#6BD6C1","#FFF3C4","#FF9E4F"];
  function size(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  size(); window.addEventListener("resize", size, {passive:true});
  function burst(n){
    if(REDUCED) n = Math.min(n,24);
    for(let i=0;i<n;i++){
      parts.push({x:innerWidth*(0.15+Math.random()*0.7), y:innerHeight*0.35-Math.random()*120,
        vx:(Math.random()-0.5)*260, vy:-160-Math.random()*280,
        w:6+Math.random()*7, h:9+Math.random()*10,
        r:Math.random()*6.28, vr:(Math.random()-0.5)*9,
        c:COLORS[(Math.random()*COLORS.length)|0], life:2.6+Math.random()*1.6});
    }
    if(!raf){ last=performance.now(); raf=requestAnimationFrame(loop); }
  }
  function loop(now){
    const dt = Math.min(0.05,(now-last)/1000); last=now;
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.life-=dt; if(p.life<=0||p.y>innerHeight+60){ parts.splice(i,1); continue; }
      p.vy+=620*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
      cx.fillStyle=p.c; cx.globalAlpha=Math.min(1,p.life);
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    }
    if(parts.length){ raf=requestAnimationFrame(loop); } else { raf=0; cx.clearRect(0,0,innerWidth,innerHeight); }
  }
  return { burst:burst };
})();

/* ============================================================
   screens + countdown
   ============================================================ */
let timers = [];
function later(fn,ms){ const id=setTimeout(fn,ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function show(id){
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  $("#"+id).classList.add("active");
}

function runCountdown(){
  show("countdown");
  Music.start();
  const box=$("#cdWords"); box.innerHTML="";
  const words=CONFIG.countdown.slice();
  const step = REDUCED ? 320 : 520;
  words.forEach(function(w,i){
    later(function(){
      const el=document.createElement("span");
      el.className="cd-word in"; el.textContent=T(w);
      box.appendChild(el); Sound.pop();
    }, i*step);
  });
  later(function(){
    const el=document.createElement("span");
    el.className="cd-word final in"; el.textContent=T(CONFIG.countdownFinal);
    box.appendChild(el); Sound.bell(); buzz(30);
  }, words.length*step+120);
  later(startRide, words.length*step+1150);
}

/* ============================================================
   the ride
   ============================================================ */
const G = CONFIG.game;
const stage=$("#stage"), actors=$("#actors"), riderEl=$("#rider"),
      meterFill=$("#meterFill"), heartsEl=$("#hearts"),
      bubbleEl=$("#bubble"), chipEl=$("#chip"), tapHintEl=$("#tapHint"),
      farEl=$("#far"), dashEl=$("#dash"), cloudEl=$("#clouds"), midEl=$("#mid");

let W=0, H=0, ROAD=0, RIDER_X=0, SCALE=1;
let items=[], prog=0, t=0, speed=0, y=0, vy=0, onGround=true,
    hearts=G.hearts, invuln=0, slow=0, downFor=0, nextGap=0,
    running=false, raf=0, lastT=0, jumped=false, jumpBuffer=0, bubbleIdx=0,
    scrollFar=0, scrollMid=0, scrollDash=0, scrollCloud=0, usedTouch=false;

function measure(){
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  ROAD = clamp(Math.round(H*0.34), 92, 215);
  SCALE = clamp(H/660, 0.78, 1.06);
  stage.style.setProperty("--roadH", ROAD+"px");
  stage.style.setProperty("--groundY", ROAD+"px");   // everything stands on the road's edge
  stage.style.setProperty("--scale", SCALE.toFixed(3));
  RIDER_X = Math.round(Math.min(74, W*0.16));
  stage.style.setProperty("--riderX", RIDER_X+"px");
}
window.addEventListener("resize", function(){ if(running) measure(); }, {passive:true});

function paintHearts(){
  let s="";
  for(let i=0;i<G.hearts;i++) s += '<i class="'+(i<hearts?"":"off")+'">❤️</i>';
  heartsEl.innerHTML = s;
}

function bubble(txt,ms){
  bubbleEl.textContent = T(txt);
  bubbleEl.classList.add("show");
  later(function(){ bubbleEl.classList.remove("show"); }, ms||2400);
}
function chip(txt){
  chipEl.textContent = T(txt);
  chipEl.classList.remove("show"); void chipEl.offsetWidth; chipEl.classList.add("show");
}

function spawn(){
  const heart = Math.random() < 0.26;
  const el = document.createElement("div");
  let it;
  if(heart){
    el.className = "pick";
    el.innerHTML = HEART_SVG;
    it = { el:el, x:W+40, w:30*SCALE, h:28*SCALE, yOff:(86+Math.random()*26)*SCALE, heart:true, dead:false };
    el.style.bottom = "calc(var(--groundY) + " + Math.round(it.yOff) + "px)";
  }else{
    const o = OBSTACLES[(Math.random()*OBSTACLES.length)|0];
    el.className = "obs";
    el.innerHTML = o.svg;
    it = { el:el, x:W+40, w:o.w*SCALE, h:o.h*SCALE, yOff:0, heart:false, dead:false };
  }
  el.style.transform = "translate3d(" + it.x + "px,0,0)";
  actors.appendChild(el);
  items.push(it);
  nextGap = G.gapMin + Math.random()*G.gapVar + (heart?0:0.1);
}

function hitSomething(){
  hearts--; paintHearts();
  invuln = 1.25; slow = 0.75;
  stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
  riderEl.classList.add("blink");
  Sound.hit(); buzz(40);
  if(hearts <= 0){
    hearts = 0; paintHearts();
    downFor = 1.4; invuln = 2.6;
    riderEl.classList.add("down");
    chip(CONFIG.ride.chips.tumble); bubble(CONFIG.ride.tumble, 2200);
    Sound.crash(); buzz([50,70,50]);
    later(function(){
      hearts = G.hearts; paintHearts();
      riderEl.classList.remove("down");
    }, 1400);
  }else{
    bubble(CONFIG.ride.hits[(Math.random()*CONFIG.ride.hits.length)|0], 1500);
  }
}

function doJump(){
  vy = -G.jumpV*Math.sqrt(SCALE); onGround = false; jumpBuffer = 0;
  Sound.jump();
  if(!jumped){ jumped = true; tapHintEl.classList.add("hide"); }
}
function jump(){
  if(!running || downFor>0) return;
  Sound.init();
  if(!onGround){ jumpBuffer = 0.16; return; }   // remember it; it fires the moment he lands
  doJump();
}

function step(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT = now; t += dt;

  // speed: ramps up, drops after a knock, zero while he's on the floor
  const base = G.speed0 + (G.speed1-G.speed0)*clamp(prog,0,1);
  if(slow>0){ slow -= dt; }
  if(downFor>0){ downFor -= dt; speed = 0; }
  else { speed = slow>0 ? base*0.45 : base; }
  if(invuln>0){ invuln -= dt; if(invuln<=0) riderEl.classList.remove("blink"); }

  // distance covered
  const total = (G.speed0+G.speed1)/2 * G.rideSeconds;
  prog += (speed*dt)/total;
  if(t > G.maxSeconds) prog += 0.5*dt;          // he gets there, always
  prog = clamp(prog,0,1);

  // jump physics
  if(!onGround || vy<0){
    vy += G.gravity*dt; y -= vy*dt;
    if(y<=0){ y=0; vy=0; if(!onGround){ onGround=true; Sound.land(); } }
  }
  if(jumpBuffer>0){ jumpBuffer -= dt; if(onGround && jumpBuffer>0) doJump(); }
  riderEl.style.transform = "translate3d(0," + (-y) + "px,0)";

  // parallax
  scrollFar   = (scrollFar   + speed*0.22*dt) % 900;
  scrollMid   = (scrollMid   + speed*0.52*dt) % 250;
  scrollDash  = (scrollDash  + speed*dt) % 70;
  scrollCloud = (scrollCloud + speed*0.07*dt) % 330;
  farEl.style.backgroundPosition   = (-scrollFar) + "px bottom";
  midEl.style.backgroundPosition   = (-scrollMid) + "px bottom";
  dashEl.style.backgroundPosition  = (-scrollDash) + "px 0";
  cloudEl.style.backgroundPosition = (-scrollCloud) + "px 0";

  // spawn + move items
  if(prog < 0.93){
    nextGap -= dt;
    if(nextGap <= 0) spawn();
  }
  const rx1 = RIDER_X+34*SCALE, rx2 = RIDER_X+102*SCALE;   // hitbox hugs the Vespa, not the whole sprite
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.x -= speed*dt;
    it.el.style.transform = "translate3d(" + it.x + "px,0,0)";
    if(it.x < -90){ it.el.remove(); items.splice(i,1); continue; }
    if(it.dead) continue;
    const pad = it.heart ? 0 : 6*SCALE;          // forgiving edges on obstacles
    const overlap = (it.x + pad < rx2) && (it.x + it.w - pad > rx1);
    if(!overlap) continue;
    if(it.heart){
      if(Math.abs(y - it.yOff) < 52*SCALE){
        it.dead = true; it.el.remove(); items.splice(i,1);
        if(hearts < G.hearts){ hearts++; paintHearts(); chip(CONFIG.ride.chips.heart); }
        Sound.ding(); buzz(15);
      }
    }else if(invuln<=0 && y < it.h-12*SCALE){
      it.dead = true;
      hitSomething();
    }
  }

  // things he says on the way
  const bs = CONFIG.ride.bubbles;
  while(bubbleIdx<bs.length && prog>=bs[bubbleIdx].at){ bubble(bs[bubbleIdx].text,2400); bubbleIdx++; }

  meterFill.style.width = (prog*100).toFixed(2)+"%";
  if(prog>=1){ arrive(); }
}

function loop(now){
  if(!running) return;
  try{ step(now); }catch(e){ /* a hiccup must never strand her mid-ride */ }
  if(running) raf = requestAnimationFrame(loop);
}

function startRide(){
  show("ride");
  measure();
  items.forEach(function(it){ it.el.remove(); }); items=[];
  prog=0; t=0; y=0; vy=0; onGround=true; speed=G.speed0;
  hearts=G.hearts; invuln=0; slow=0; downFor=0; nextGap=1.1;
  jumped=false; jumpBuffer=0; bubbleIdx=0; running=true;
  riderEl.classList.remove("blink","down");
  riderEl.style.transform = "translate3d(0,0,0)";
  tapHintEl.classList.remove("hide");
  $("#winOverlay").classList.remove("active");
  paintHearts(); meterFill.style.width="0%";
  lastT = performance.now();
  raf = requestAnimationFrame(loop);
}

function arrive(){
  running = false; cancelAnimationFrame(raf);
  prog = 1; meterFill.style.width = "100%";
  items.forEach(function(it){ it.el.remove(); }); items=[];
  riderEl.classList.remove("blink");
  chip(CONFIG.ride.chips.arrive);
  Music.stop(0.9);
  Sound.skid(); Sound.bell(); buzz([30,50,120]);
  later(function(){
    Sound.cheer(); Confetti.burst(130); buzz([30,50,30,50,160]);
    $("#winOverlay").classList.add("active");
  }, 900);
  later(function(){ Confetti.burst(60); }, 1700);
}

/* ---- input: tap anywhere to jump ---- */
const rideScreen = $("#ride");
rideScreen.addEventListener("touchstart", function(){ usedTouch = true; jump(); }, {passive:true});
rideScreen.addEventListener("mousedown", function(){ if(!usedTouch) jump(); }, {passive:true});
window.addEventListener("keydown", function(e){
  if((e.code==="Space"||e.code==="ArrowUp") && running){ e.preventDefault(); jump(); }
});

/* ============================================================
   message + clues
   ============================================================ */
let opened = 0;
$("#prizeBtn").addEventListener("click", function(){ show("prize"); $("#prize").scrollTop=0; Sound.pop(); });

function sizeCard(){
  const back=$("#prizeBack");
  $("#flipinner").style.minHeight = Math.max(260, back.scrollHeight+14) + "px";
}
window.addEventListener("resize", sizeCard, {passive:true});
later(sizeCard,60); later(sizeCard,900);

const flipcard = $("#flipcard");
flipcard.addEventListener("click", function(){
  if(flipcard.classList.contains("open")) return;
  flipcard.classList.add("open");
  Sound.ding(); buzz(30);
  later(function(){
    const box=$("#cluesBox");
    box.classList.remove("hidden"); box.classList.add("reveal");
    Confetti.burst(50);
  }, REDUCED?100:700);
});

$("#envRow").addEventListener("click", function(e){
  const b = e.target.closest(".env");
  if(!b || b.classList.contains("open")) return;
  b.classList.add("open");
  Sound.pop(); buzz(18);
  opened++;
  if(opened === CONFIG.clues.items.length){
    later(function(){
      const ts=$("#teaser");
      ts.classList.remove("hidden"); ts.classList.add("reveal");
      Sound.ding(); Confetti.burst(40);
      ts.scrollIntoView({behavior: REDUCED?"auto":"smooth", block:"center"});
    }, 450);
  }
});

$("#rematchBtn").addEventListener("click", function(){
  clearTimers();
  opened = 0;
  flipcard.classList.remove("open");
  sizeCard();
  $("#cluesBox").classList.add("hidden");
  $("#teaser").classList.add("hidden");
  document.querySelectorAll(".env").forEach(function(el){ el.classList.remove("open"); });
  Sound.pop();
  runCountdown();
});
$("#waBtn").addEventListener("click", function(){ Sound.ding(); });

$("#startBtn").addEventListener("click", function(){
  Sound.init(); Sound.bell(); buzz(25);
  clearTimers();
  runCountdown();
});

})();
</script>
