<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8C69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Thumb War Championship">
<title>Thumb War Championship 🏆</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;inset:0;
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:500;color:#3B2340;
  background:linear-gradient(168deg,#FFE0AE 0%,#FFB07C 24%,#FF8A82 48%,#F76E8E 70%,#A96BB0 100%);
  background-attachment:fixed;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 38% at 50% 12%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);
}
#app{position:absolute;inset:0;height:calc(var(--vh,1vh) * 100)}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));
}
.screen.active{display:flex;animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
.screen.scrolls{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;justify-content:flex-start}
/* flex children must never be squashed: let the screen scroll instead */
.screen.scrolls > *,.clues > *,.actions > *{flex:0 0 auto}
#match > .topbar,#match > .barwrap,#match > .tapzone,#match > .hint{flex:0 0 auto}

/* ---------- type ---------- */
h1,h2,h3,p{margin:0}
.kicker{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#7A3B57;opacity:.85}
.big{font-size:clamp(26px,8.2vw,38px);font-weight:700;line-height:1.1;text-align:center;letter-spacing:-.01em}
.sub{font-size:clamp(14px,4.1vw,17px);line-height:1.45;text-align:center;opacity:.8;font-weight:400}
.fine{font-size:11.5px;line-height:1.4;text-align:center;opacity:.62;font-weight:400;max-width:17em}

/* ---------- card / buttons ---------- */
.card{
  background:rgba(255,255,255,.93);border-radius:28px;
  box-shadow:0 18px 40px -18px rgba(90,30,70,.5),0 2px 0 rgba(255,255,255,.7) inset;
  padding:26px 22px;width:100%;max-width:420px;
}
.btn{
  -webkit-appearance:none;appearance:none;border:0;font-family:inherit;font-weight:600;
  color:#fff;background:linear-gradient(180deg,#FF5E7D,#E8365F);
  border-radius:999px;padding:18px 26px;font-size:18px;width:100%;max-width:340px;
  min-height:60px;box-shadow:0 10px 22px -8px rgba(200,30,70,.75),0 -3px 0 rgba(0,0,0,.12) inset;
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
}
.btn:active{transform:scale(.96);box-shadow:0 5px 12px -8px rgba(200,30,70,.8)}
.btn.soft{background:rgba(255,255,255,.85);color:#7A3B57;box-shadow:0 8px 18px -10px rgba(90,30,70,.5)}
.btn.gold{background:linear-gradient(180deg,#FFCE4F,#F5A623);color:#5A3210}
.btn.pulse{animation:pulse 1.7s ease-in-out infinite}

/* ---------- mute ---------- */
#mute{
  position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:70;
  width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.55);
  font-size:20px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
}
#mute:active{transform:scale(.9)}

/* ---------- intro ---------- */
.intro-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;min-height:0}
.hero{height:min(27vh,190px);width:auto;filter:drop-shadow(0 16px 18px rgba(120,40,70,.32));animation:bob 2.8s ease-in-out infinite}
.vs-tag{
  display:inline-block;background:#3B2340;color:#FFD66B;border-radius:999px;
  padding:6px 16px;font-size:13px;font-weight:600;letter-spacing:.12em;
}

/* ---------- countdown ---------- */
#countdown{justify-content:center;gap:10px}
.cd-words{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:center;max-width:340px}
.cd-word{
  font-size:clamp(30px,10vw,46px);font-weight:700;color:#fff;opacity:0;
  text-shadow:0 6px 0 rgba(150,40,80,.35);
}
.cd-word.in{animation:popIn .45s cubic-bezier(.3,1.6,.5,1) both}
.cd-word.final{display:block;width:100%;text-align:center;color:#FFE27A;font-size:clamp(26px,8.4vw,38px);margin-top:6px}

/* ---------- match ---------- */
#match{justify-content:flex-start;gap:0}
.topbar{width:100%;max-width:440px;display:flex;align-items:center;gap:10px;padding-right:52px}
.round{font-size:12px;font-weight:600;letter-spacing:.14em;color:#7A3B57;white-space:nowrap}
.timeline{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.45);overflow:hidden}
.timeline i{display:block;height:100%;width:0%;background:#fff;border-radius:99px}

.arena{
  position:relative;flex:1;min-height:0;width:100%;max-width:440px;
  display:flex;align-items:flex-end;justify-content:center;
}
.ring{
  position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:min(86vw,380px);height:26px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(90,30,70,.30),rgba(90,30,70,0) 72%);
}
.fighters{display:flex;align-items:flex-end;justify-content:center;position:relative;padding-bottom:6px;gap:5vw}
.fighter{transform-origin:50% 100%;will-change:transform;line-height:0}
.fighter .flip{display:block;line-height:0}
.fighter.me .flip{transform:scaleX(-1)}
.thumb{height:min(29vh,196px);width:auto;display:block}
.thumb.glow{filter:drop-shadow(0 0 16px rgba(255,220,120,.95))}
.thumb.gone{opacity:0;transition:opacity .5s ease .25s}

.bubble{
  position:absolute;top:34px;right:2px;max-width:62%;
  background:#fff;color:#3B2340;border-radius:18px 18px 4px 18px;
  padding:10px 13px;font-size:14px;line-height:1.3;font-weight:500;
  box-shadow:0 10px 22px -12px rgba(90,30,70,.7);
  opacity:0;transform:scale(.8) translateY(6px);pointer-events:none;
  transition:opacity .18s ease,transform .18s cubic-bezier(.3,1.6,.5,1);
}
.bubble.show{opacity:1;transform:scale(1) translateY(0)}
.chip{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);
  background:#3B2340;color:#FFD66B;border-radius:14px;padding:10px 18px;
  font-size:clamp(16px,5vw,22px);font-weight:700;letter-spacing:.04em;white-space:nowrap;
  opacity:0;pointer-events:none;box-shadow:0 12px 26px -12px rgba(0,0,0,.6);
}
.chip.show{animation:chipPop .9s cubic-bezier(.22,1,.36,1) both}
.ghost{
  position:absolute;left:62%;bottom:34%;width:58px;opacity:0;pointer-events:none;
}
.ghost.go{animation:floatGhost 2.4s ease-out both}

/* power bar */
.barwrap{width:100%;max-width:440px;margin-top:6px}
.barlabels{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#5E2A48}
.barlabels b{font-weight:700}
.bar{
  position:relative;height:26px;border-radius:999px;overflow:hidden;
  background:linear-gradient(180deg,#8E5AA6,#7A4A92);
  box-shadow:0 6px 16px -8px rgba(60,20,50,.8),0 2px 3px rgba(0,0,0,.18) inset;
}
.bar .fill{
  position:absolute;inset:0 auto 0 0;width:50%;
  background:linear-gradient(180deg,#FFE07A,#FFB13C);
  border-radius:999px 0 0 999px;
  box-shadow:0 0 14px rgba(255,200,90,.55);
}
.bar .knob{
  position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;
  border-radius:50%;background:#fff;box-shadow:0 4px 10px -3px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.bar.rush .fill{animation:barFlash .35s ease}

/* tap pad */
.tapzone{
  width:100%;max-width:440px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  padding:14px 0 4px;position:relative;
}
.tappad{
  position:relative;border:0;padding:0;font-family:inherit;cursor:pointer;
  width:min(44vw,180px);height:min(44vw,180px);border-radius:50%;
  background:radial-gradient(70% 70% at 50% 30%,#FFF7E8,#FFD79B);
  box-shadow:0 14px 30px -12px rgba(120,40,70,.8),0 -6px 0 rgba(190,120,60,.25) inset;
  color:#A83E5E;font-size:clamp(18px,5.4vw,24px);font-weight:700;letter-spacing:.06em;
  display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1;
  overflow:hidden;animation:tapPulse 1.1s ease-in-out infinite;
}
.tappad small{font-size:11px;font-weight:600;letter-spacing:.1em;opacity:.65;margin-top:3px}
.tappad.hit{animation:none;transform:scale(.93)}
.tappad.frozen{filter:grayscale(.7) brightness(.9);animation:none}
.ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  border:3px solid rgba(255,255,255,.9);width:40px;height:40px;margin:-20px 0 0 -20px;
  animation:rip .5s ease-out forwards;
}
.hint{font-size:12px;opacity:.7;text-align:center;margin-top:2px;font-weight:400}

/* win overlay */
.overlay{
  position:absolute;inset:0;z-index:40;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  background:radial-gradient(70% 50% at 50% 42%,rgba(255,255,255,.4),rgba(90,30,70,.55));
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.overlay.active{display:flex;animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both}
.overlay .sub{width:100%}
.trophy{font-size:62px;line-height:1;animation:bob 2.2s ease-in-out infinite}
.winname{
  width:100%;overflow-wrap:break-word;
  font-size:clamp(26px,8.4vw,40px);font-weight:700;color:#fff;text-align:center;line-height:1.08;
  text-shadow:0 6px 0 rgba(150,40,80,.35)
}

/* ---------- prize ---------- */
#prize{gap:16px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.flipcard{width:100%;max-width:420px;perspective:1200px;cursor:pointer}
.flipinner{position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.1,.4,1)}
.flipcard.open .flipinner{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipinner{min-height:260px}
.face.front{
  background:linear-gradient(160deg,#FFD873,#F7A23D);color:#5A3210;
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:260px;text-align:center;
}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;gap:14px}
.prize-line{font-size:clamp(16px,4.6vw,19px);line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.prize-line .em{flex:0 0 auto;font-size:20px}
.prize-line.lead{font-weight:700;font-size:clamp(19px,5.6vw,23px);line-height:1.2}
.seal{font-size:52px;line-height:1;animation:bob 2.6s ease-in-out infinite}
.taphint{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.7}

.clues{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;align-items:center}
.envrow{display:flex;gap:10px;width:100%}
.env{
  flex:1;border:0;font-family:inherit;cursor:pointer;padding:0;
  border-radius:20px;min-height:104px;background:rgba(255,255,255,.9);
  box-shadow:0 12px 26px -16px rgba(90,30,70,.8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#7A3B57;font-weight:600;font-size:12px;transition:transform .14s ease;
  overflow:hidden;padding:8px 7px;text-align:center;
}
.env .ico{font-size:26px;line-height:1}
.env:active{transform:scale(.95)}
.env.open{background:#fff;animation:envPop .5s cubic-bezier(.3,1.5,.5,1) both}
.env.open .ico{font-size:22px}
.env .txt{display:none;font-size:12.5px;line-height:1.28;font-weight:500;color:#3B2340}
.env.open .txt{display:block}
.env.open .lbl{display:none}
.note{
  background:rgba(59,35,64,.85);color:#FFE9C7;border-radius:18px;padding:13px 16px;
  font-size:13.5px;line-height:1.4;text-align:center;width:100%;font-weight:400;
}
.teaser{
  width:100%;text-align:center;font-size:clamp(15px,4.4vw,18px);font-weight:600;color:#fff;
  background:rgba(255,255,255,.18);border:1px dashed rgba(255,255,255,.6);
  border-radius:18px;padding:14px 16px;line-height:1.35;
}
.hidden{display:none !important}
.reveal{animation:popIn .5s cubic-bezier(.3,1.4,.5,1) both}
.actions{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:2px}
.sig{font-size:12px;opacity:.65;text-align:center;font-weight:400;padding-bottom:4px}

#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---------- thumb svg states ---------- */
.thumb [data-f]{display:none}
.thumb[data-face="normal"] [data-f="normal"],
.thumb[data-face="strain"] [data-f="strain"],
.thumb[data-face="faint"]  [data-f="faint"],
.thumb[data-face="win"]    [data-f="win"]{display:block}
.thumb .crown{opacity:0;transition:opacity .3s ease}
.thumb[data-face="win"] .crown{opacity:1}
.thumb .ties{transform-origin:76% 26%;animation:tie 1.6s ease-in-out infinite}
.thumb .drop{opacity:0}
.thumb[data-face="strain"] .drop,.thumb[data-face="faint"] .drop{opacity:1}

/* ---------- keyframes ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes tapPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tie{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes rip{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(3)}}
@keyframes chipPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
@keyframes floatGhost{0%{opacity:0;transform:translateY(0) scale(.6)}18%{opacity:.95;transform:translateY(-20px) scale(1)}100%{opacity:0;transform:translateY(-150px) scale(1.15) rotate(8deg)}}
@keyframes barFlash{50%{filter:brightness(1.5)}}
@keyframes envPop{0%{transform:scale(.9) rotate(-2deg)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes dodgeAnim{0%{transform:translateX(0) rotate(0)}35%{transform:translateX(26px) rotate(14deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes stretchAnim{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.13) translateY(-6px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.08s !important;
  }
}
@media (max-height:620px){
  .thumb{height:min(27vh,180px)}
  .tappad{width:min(38vw,150px);height:min(38vw,150px)}
  .hero{height:min(23vh,150px)}
}
</style>
</head>
<body>
<div id="app">

  <button id="mute" aria-label="Sound on or off">🔊</button>

  <!-- 1. INTRO -->
  <section class="screen active" id="intro">
    <div class="intro-wrap">
      <span class="kicker" id="i-kicker"></span>
      <div id="heroSlot"></div>
      <span class="vs-tag" id="i-vs"></span>
      <h1 class="big" id="i-title"></h1>
      <p class="sub" id="i-sub"></p>
    </div>
    <button class="btn pulse" id="startBtn"></button>
    <p class="fine" id="i-fine" style="margin-top:12px"></p>
  </section>

  <!-- 2. COUNTDOWN -->
  <section class="screen" id="countdown">
    <div class="cd-words" id="cdWords"></div>
  </section>

  <!-- 3. MATCH -->
  <section class="screen" id="match">
    <div class="topbar">
      <span class="round" id="m-round"></span>
      <div class="timeline"><i id="timeline"></i></div>
    </div>

    <div class="arena" id="arena">
      <div class="ring"></div>
      <div class="fighters">
        <div id="herSlot"></div>
        <div id="meSlot"></div>
      </div>
      <div class="bubble" id="bubble"></div>
      <div class="chip" id="chip"></div>
      <svg class="ghost" id="ghost" viewBox="0 0 60 72" aria-hidden="true">
        <path d="M30 3c13 0 22 10 22 23v40l-8-7-7 7-7-7-7 7-7-7-8 7V26C8 13 17 3 30 3z" fill="#fff" opacity=".92"/>
        <circle cx="22" cy="28" r="3.6" fill="#3B2340"/><circle cx="38" cy="28" r="3.6" fill="#3B2340"/>
        <path d="M25 40q5 5 10 0" stroke="#3B2340" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="barwrap">
      <div class="barlabels"><span id="m-you"></span><span id="m-me"></span></div>
      <div class="bar" id="bar">
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob">👍</div>
      </div>
    </div>

    <div class="tapzone">
      <button class="tappad" id="tappad"></button>
    </div>
    <p class="hint" id="m-hint"></p>

    <!-- 4. VICTORY overlay -->
    <div class="overlay" id="winOverlay">
      <div class="trophy">🏆</div>
      <h2 class="winname" id="w-title"></h2>
      <p class="sub" id="w-sub" style="color:#fff;opacity:.95"></p>
      <button class="btn gold" id="prizeBtn"></button>
    </div>
  </section>

  <!-- 5/6/7. PRIZE -->
  <section class="screen scrolls" id="prize">
    <span class="kicker" id="p-kicker" style="margin-bottom:10px"></span>

    <div class="flipcard" id="flipcard">
      <div class="flipinner" id="flipinner">
        <div class="card face front">
          <div class="seal">🎁</div>
          <h2 class="big" style="font-size:clamp(22px,6.6vw,28px)" id="p-front"></h2>
          <span class="taphint" id="p-taphint"></span>
        </div>
        <div class="card face back" id="prizeBack"></div>
      </div>
    </div>

    <div class="clues hidden" id="cluesBox">
      <h3 class="big" style="font-size:clamp(20px,6vw,25px);color:#fff;text-shadow:0 4px 0 rgba(150,40,80,.3)" id="c-title"></h3>
      <p class="sub" style="color:#fff;opacity:.9;margin-top:-4px" id="c-sub"></p>
      <div class="envrow" id="envRow"></div>
      <div class="note" id="c-note"></div>
      <div class="teaser hidden" id="teaser"></div>
      <div class="actions">
        <a class="btn" id="waBtn" href="#" target="_blank" rel="noopener"></a>
        <button class="btn soft" id="rematchBtn"></button>
      </div>
      <p class="sig" id="p-sig"></p>
    </div>
  </section>

</div>
<canvas id="confetti"></canvas>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG — everything you might want to change lives here.
   ============================================================ */
const CONFIG = {
  herName: "Annaëlle",
  myName: "Gianluca",

  // WhatsApp: leave number empty so she picks the chat herself.
  // Or put your number in international format, digits only: "34600111222"
  whatsappNumber: "",
  whatsappText: "I won the thumb war. See you at 19:00 😏",

  intro: {
    kicker: "Thumb War Championship",
    vs: "{name}  ⚔️  {me}",
    title: "{me}'s thumb challenges you to a THUMB WAR 👍⚔️",
    sub: "One round. No mercy. No rules worth mentioning.",
    button: "Accept the challenge",
    fine: "By tapping you agree to be picked up tomorrow."
  },

  countdown: ["1,", "2,", "3,", "4…"],
  countdownFinal: "I declare a THUMB WAR!",

  match: {
    round: "ROUND 1",
    you: "{name}",
    me: "{me}",
    tap: "TAP!",
    tapSmall: "FAST",
    hint: "Tap anywhere. Keep tapping.",
    taunts: {

/* ============================================================
   sound (Web Audio, created on first tap only)
   ============================================================ */
const Sound = (function(){
  let ctx=null, muted=false, noise=null;
  try { muted = localStorage.getItem("tw_muted")==="1"; } catch(e){}
  function init(){
    if(ctx) return ctx;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      const len = ctx.sampleRate*1;
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ ctx=null; }
    return ctx;
  }
  function on(){ if(ctx && ctx.state==="suspended") ctx.resume(); return !muted && ctx; }
  function tone(o){
    try{
    if(!on()) return;
    const t0 = ctx.currentTime + (o.delay||0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type||"sine";
    osc.frequency.setValueAtTime(o.f, t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30,o.to), t0+(o.dur||.2));
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol||0.18, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+(o.dur||.2));
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+(o.dur||.2)+0.05);
    }catch(e){}
  }
  function hiss(dur, f, vol, delay){
    try{
    if(!on() || !noise) return;
    const t0 = ctx.currentTime + (delay||0);
    const src = ctx.createBufferSource(); src.buffer = noise;
    const bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.1;
    bp.frequency.setValueAtTime(f, t0);
    bp.frequency.exponentialRampToValueAtTime(f*0.35, t0+dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0+dur+0.05);
    }catch(e){}
  }
  return {
    init: init,
    get muted(){ return muted; },
    toggle: function(){
      muted = !muted;
      try{ localStorage.setItem("tw_muted", muted?"1":"0"); }catch(e){}
      return muted;
    },
    tap: function(){ tone({type:"triangle", f:520+Math.random()*220, to:260, dur:0.07, vol:0.13}); },
    pop: function(){ tone({type:"triangle", f:640, to:980, dur:0.09, vol:0.2}); },
    boing: function(){
      tone({type:"sine", f:300, to:90, dur:0.34, vol:0.22});
      tone({type:"sine", f:150, to:60, dur:0.3, vol:0.1, delay:0.04});
    },
    whoosh: function(){ hiss(0.3, 2400, 0.16, 0); },
    thud: function(){ tone({type:"sine", f:120, to:48, dur:0.4, vol:0.3}); hiss(0.22, 500, 0.14, 0); },
    faint: function(){ tone({type:"sine", f:420, to:110, dur:0.8, vol:0.18}); },
    cheer: function(){
      hiss(1.4, 1700, 0.12, 0);
      [523.25, 659.25, 783.99, 1046.5].forEach(function(f,i){
        tone({type:"triangle", f:f, dur:0.5, vol:0.16, delay:i*0.085});
      });
      tone({type:"triangle", f:1318.5, dur:0.7, vol:0.14, delay:0.42});
    },
    ding: function(){ tone({type:"sine", f:880, dur:0.25, vol:0.16}); tone({type:"sine", f:1320, dur:0.35, vol:0.1, delay:0.05}); }
  };
})();

/* ============================================================
   confetti
   ============================================================ */
const Confetti = (function(){
  const cv = $("#confetti"), cx = cv.getContext("2d");
  let parts=[], raf=0, last=0;
  const COLORS = ["#FFD66B","#FF6F91","#9B6BD6","#6BD6C1","#FFF3C4","#FF9E4F"];
  function size(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  size(); window.addEventListener("resize", size, {passive:true});
  function burst(n){
    if(REDUCED) n = Math.min(n, 24);
    for(let i=0;i<n;i++){
      parts.push({
        x: innerWidth*(0.15+Math.random()*0.7), y: innerHeight*0.35 - Math.random()*120,
        vx:(Math.random()-0.5)*260, vy:-160-Math.random()*280,
        w:6+Math.random()*7, h:9+Math.random()*10,
        r:Math.random()*6.28, vr:(Math.random()-0.5)*9,
        c:COLORS[(Math.random()*COLORS.length)|0], life:2.6+Math.random()*1.6
      });
    }
    if(!raf){ last = performance.now(); raf = requestAnimationFrame(loop); }
  }
  function loop(now){
    const dt = Math.min(0.05,(now-last)/1000); last = now;
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.life -= dt; if(p.life<=0 || p.y>innerHeight+60){ parts.splice(i,1); continue; }
      p.vy += 620*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.globalAlpha = Math.min(1,p.life);
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    }
    if(parts.length){ raf = requestAnimationFrame(loop); }
    else { raf = 0; cx.clearRect(0,0,innerWidth,innerHeight); }
  }
  return { burst: burst };
})();

const G = CONFIG.game;
const fillEl = $("#fill"), knobEl = $("#knob"), barEl = $("#bar"),
      timelineEl = $("#timeline"), bubbleEl = $("#bubble"), chipEl = $("#chip"),
      tappad = $("#tappad"), arenaEl = $("#arena"), ghostEl = $("#ghost");

let power = 0.5, t = 0, raf = 0, lastT = 0, running = false,
    frozenUntil = 0, comeback = false, beats = [], usedTouch = false, lastRipple = 0;

function bubble(txt, ms){
  bubbleEl.textContent = T(txt);
  bubbleEl.classList.add("show");
  later(function(){ bubbleEl.classList.remove("show"); }, ms||2500);
}
function chip(txt){
  chipEl.textContent = T(txt);
  chipEl.classList.remove("show"); void chipEl.offsetWidth; chipEl.classList.add("show");
}

function buildBeats(){
  const M = CONFIG.match;
  return [
    { t:1.5,  done:false, go:function(){ bubble(M.taunts.opening, 2700); Sound.pop(); } },
    { t:4.0,  done:false, go:function(){
        power = Math.max(G.floor, power - 0.07);
        chip(M.chips.dodge); bubble(M.taunts.dodge, 2200); Sound.whoosh(); buzz(18);
        if(!REDUCED){ meThumb.style.animation = "dodgeAnim .6s ease"; later(function(){ meThumb.style.animation = ""; }, 620); }
      } },
    { t:6.8,  done:false, go:function(){
        frozenUntil = t + 1.2; tappad.classList.add("frozen");
        chip(M.chips.timeout); bubble(M.taunts.timeout, 2400); Sound.boing(); buzz([20,60,20]);
        if(!REDUCED){ meThumb.style.animation = "stretchAnim 1.2s ease"; later(function(){ meThumb.style.animation = ""; }, 1250); }
        later(function(){ tappad.classList.remove("frozen"); }, 1200);
      } },
    { t:9.2,  done:false, go:function(){ bubble(M.taunts.impressed, 2400); } },
    { t:G.comebackAt, done:false, go:function(){
        comeback = true; herThumb.classList.add("glow");
        chip(M.chips.comeback); bubble(M.taunts.cramp, 2600); Sound.ding(); buzz(25);
      } },
    { t:12.4, done:false, go:function(){ bubble(M.taunts.panic, 2000); Sound.whoosh(); } }
  ];
}

function paint(){
  const p = clamp(power,0,1);
  fillEl.style.width = (p*100).toFixed(2) + "%";
  knobEl.style.left = (p*100).toFixed(2) + "%";
  // thumbs lean: she pushes mine over as she wins
  const d = (p - 0.5) * 2;           // -1 .. 1
  herWrap.style.transform = "rotate(" + (5 + d*13).toFixed(2) + "deg)";
  meWrap.style.transform  = "rotate(" + (-5 - d*23).toFixed(2) + "deg)";
  timelineEl.style.width = clamp(t/G.forceWinAt,0,1)*100 + "%";
}

function tapHit(x,y){
  if(!running) return;
  Sound.init();
  if(t < frozenUntil){ Sound.boing(); return; }
  power += comeback ? G.tapPower*2 : G.tapPower;
  Sound.tap();
  barEl.classList.remove("rush"); void barEl.offsetWidth; barEl.classList.add("rush");
  tappad.classList.add("hit"); later(function(){ tappad.classList.remove("hit"); }, 90);
  if(!REDUCED && x!=null && performance.now()-lastRipple > 70){
    lastRipple = performance.now();
    const r = document.createElement("span");
    r.className = "ripple";
    const box = tappad.getBoundingClientRect();
    r.style.left = (x-box.left)+"px"; r.style.top = (y-box.top)+"px";
    tappad.appendChild(r);
    setTimeout(function(){ r.remove(); }, 520);
  }
}

function ceilingAt(tt){
  const P = G.pace;
  if(tt <= P[0][0]) return P[0][1];
  for(let i=1;i<P.length;i++){
    if(tt < P[i][0]){
      const a=P[i-1], b=P[i];
      return a[1] + (b[1]-a[1]) * (tt-a[0])/(b[0]-a[0]);
    }
  }
  return 1;
}

function loop(now){
  if(!running) return;
  try{ step(now); }catch(e){ /* never freeze the match over a sound or DOM hiccup */ }
  if(running) raf = requestAnimationFrame(loop);
}

function step(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now; t += dt;

  // my thumb pushes back, weaker every second
  const fade = clamp(1 - t/G.rivalFade, 0, 1);
  power -= G.rivalPower * fade * fade * dt;
  // during the "timeout" I cheat a little
  if(t < frozenUntil) power -= 0.045*dt;
  // she starts gaining on her own late in the match
  if(t > G.assistAt) power += 0.035*(t-G.assistAt)*dt;
  // hard guarantee: she wins, always
  if(t > G.forceWinAt) power += 0.7*dt;

  power = clamp(power, G.floor, ceilingAt(t));
  if(t > G.forceWinAt) power = Math.min(1, power + 0.9*dt);

  for(let i=0;i<beats.length;i++){
    if(!beats[i].done && t >= beats[i].t){
      beats[i].done = true;
      try{ beats[i].go(); }catch(e){}
    }
  }

  meThumb.setAttribute("data-face", power > 0.74 ? "strain" : "normal");

  paint();

  if(power >= 1){ winSequence(); }
}

function startMatch(){
  show("match");
  power = 0.5; t = 0; frozenUntil = 0; comeback = false; running = true;
  beats = buildBeats();
  herThumb.classList.remove("glow"); meThumb.classList.remove("gone");
  meWrap.style.transition = ""; meWrap.style.transform = "";
  herThumb.setAttribute("data-face","normal"); meThumb.setAttribute("data-face","normal");
  meThumb.style.animation = ""; tappad.classList.remove("frozen");
  ghostEl.classList.remove("go");
  $("#winOverlay").classList.remove("active");
  paint();
  lastT = performance.now();
  raf = requestAnimationFrame(loop);
  later(function(){ bubble("Ready when you are. 😼", 1800); }, 150);
}

function winSequence(){
  running = false; cancelAnimationFrame(raf);
  power = 1; paint();
  meThumb.setAttribute("data-face","faint");
  herThumb.setAttribute("data-face","win");
  meWrap.style.transition = "transform .55s cubic-bezier(.3,1.4,.5,1)";
  meWrap.style.transform = "rotate(-76deg) translateY(8px)";
  Sound.thud(); buzz([40,60,120]);

  later(function(){ Sound.faint(); ghostEl.classList.add("go"); }, 420);
  later(function(){ meThumb.classList.add("gone"); }, 700);
  later(function(){
    Sound.cheer(); Confetti.burst(130); buzz([30,50,30,50,160]);
    $("#winOverlay").classList.add("active");
  }, 1250);
  later(function(){ Confetti.burst(70); }, 2000);
}

/* ---- input: touch first, mouse as fallback ---- */
const matchScreen = $("#match");
matchScreen.addEventListener("touchstart", function(e){
  usedTouch = true;
  const tp = e.changedTouches && e.changedTouches[0];
  tapHit(tp?tp.clientX:null, tp?tp.clientY:null);
}, {passive:true});
matchScreen.addEventListener("mousedown", function(e){
  if(usedTouch) return;
  tapHit(e.clientX, e.clientY);
}, {passive:true});
// keyboard, for desktop testing
window.addEventListener("keydown", function(e){
  if(e.code==="Space" && running){ e.preventDefault(); tapHit(null,null); }
});

/* ============================================================
   prize + clues
   ============================================================ */
let opened = 0;
function goPrize(){
  show("prize");
  $("#prize").scrollTop = 0;
  Sound.pop();
}
$("#prizeBtn").addEventListener("click", goPrize);

function sizeCard(){
  const back = $("#prizeBack");
  const h = back.scrollHeight;
  $("#flipinner").style.minHeight = Math.max(260, h + 14) + "px";
}
window.addEventListener("resize", sizeCard, {passive:true});
later(sizeCard, 60);          // once the font has settled
later(sizeCard, 900);

const flipcard = $("#flipcard");
flipcard.addEventListener("click", function(){
  if(flipcard.classList.contains("open")) return;
  flipcard.classList.add("open");
  Sound.ding(); buzz(30);
  later(function(){
    const box = $("#cluesBox");
    box.classList.remove("hidden"); box.classList.add("reveal");
    Confetti.burst(50);
  }, REDUCED ? 100 : 700);
});

$("#envRow").addEventListener("click", function(e){
  const b = e.target.closest(".env");
  if(!b || b.classList.contains("open")) return;
  b.classList.add("open");
  Sound.pop(); buzz(18);
  opened++;
  if(opened === CONFIG.clues.items.length){
    later(function(){
      const ts = $("#teaser");
      ts.classList.remove("hidden"); ts.classList.add("reveal");
      Sound.ding(); Confetti.burst(40);
      ts.scrollIntoView({behavior: REDUCED ? "auto" : "smooth", block:"center"});
    }, 450);
  }
});

$("#rematchBtn").addEventListener("click", function(){
  clearTimers();
  opened = 0;
  flipcard.classList.remove("open");
  sizeCard();
  $("#cluesBox").classList.add("hidden");
  $("#teaser").classList.add("hidden");
  document.querySelectorAll(".env").forEach(function(el){ el.classList.remove("open"); });
  meWrap.style.transition = ""; meWrap.style.transform = "";
  Sound.pop();
  runCountdown();
});

$("#waBtn").addEventListener("click", function(){ Sound.ding(); });

/* ============================================================
   go
   ============================================================ */
$("#startBtn").addEventListener("click", function(){
  Sound.init(); Sound.boing(); buzz(25);
  clearTimers();
  runCountdown();
});

})();
</script>
